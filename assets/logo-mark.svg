<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Sesame pod: flat gold almond with a keyhole cut out. Works on any background. -->
  <path d="M 256 60
           C 356 60, 424 182, 424 288
           C 424 392, 344 452, 256 452
           C 168 452, 88 392, 88 288
           C 88 182, 156 60, 256 60 Z"
        fill="#D4AF37"/>
  <!-- Inner facet: subtle darker crescent for depth, still flat -->
  <path d="M 256 60
           C 356 60, 424 182, 424 288
           C 424 392, 344 452, 256 452
           C 300 440, 372 380, 372 280
           C 372 186, 320 84, 256 60 Z"
        fill="#B8942A" opacity="0.55"/>
  <!-- Keyhole -->
  <circle cx="256" cy="252" r="48" fill="#14110A"/>
  <path d="M 236 282 L 276 282 L 292 378 Q 256 400 220 378 Z" fill="#14110A"/>
</svg>
